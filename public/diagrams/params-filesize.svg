<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="920" height="340" fill="#FAF6EE"/>
  <text x="460" y="34" font-size="15" fill="#244c3b" text-anchor="middle">同一个 27B 模型，文件大小取决于量化精度</text>
  <line x1="160" y1="280" x2="820" y2="280" stroke="#6f6657" stroke-width="2"/>
  <text x="150" y="284" font-size="11" fill="#6f6657" text-anchor="end">0</text>
  <text x="828" y="284" font-size="11" fill="#6f6657" text-anchor="start">GB</text>
  <rect x="160" y="110" width="600" height="48" rx="6" fill="#356b54"/>
  <text x="172" y="139" font-size="13" fill="#FAF6EE">FP16（半精度）≈ 54 GB</text>
  <rect x="160" y="190" width="150" height="48" rx="6" fill="#9cc3b0"/>
  <text x="322" y="219" font-size="13" fill="#244c3b">4-bit 量化 ≈ 13.5 GB</text>
  <text x="460" y="312" font-size="12" fill="#6f6657" text-anchor="middle">参数量固定 270 亿；量化越狠，文件越小、越省显存，但精度略损</text>
</svg>
