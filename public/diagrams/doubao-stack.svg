  <path d="M 360 105 L 556 105" stroke="#6f6657" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 680 140 L 680 206" stroke="#6f6657" stroke-width="2" fill="none" marker-end="url(#a)"/>
