  <text x="140" y="292" font-size="12" fill="#6f6657" text-anchor="middle">输入层</text>
  <text x="790" y="208" font-size="12" fill="#6f6657" text-anchor="middle">输出</text>
  <text x="300" y="292" font-size="12" fill="#6f6657">○ 小圆点 = 旋钮（连接强度，训练时反复拧动）</text>
