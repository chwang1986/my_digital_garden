    <line x1="140" y1="90" x2="460" y2="140"/>
    <line x1="140" y1="90" x2="460" y2="200"/>
    <line x1="140" y1="90" x2="460" y2="260"/>
    <line x1="140" y1="150" x2="460" y2="80"/>
    <line x1="140" y1="150" x2="460" y2="140"/>
    <line x1="140" y1="150" x2="460" y2="200"/>
    <line x1="140" y1="150" x2="460" y2="260"/>
    <line x1="140" y1="210" x2="460" y2="80"/>
    <line x1="140" y1="210" x2="460" y2="140"/>
    <line x1="140" y1="210" x2="460" y2="200"/>
    <line x1="140" y1="210" x2="460" y2="260"/>
    <line x1="140" y1="270" x2="460" y2="80"/>
    <line x1="140" y1="270" x2="460" y2="140"/>
    <line x1="140" y1="270" x2="460" y2="200"/>
